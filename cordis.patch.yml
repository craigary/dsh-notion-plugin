- insert:
    # The Notion MCP server is registered dynamically by the plugin at runtime
    # through ctx.mcpManager (DSH >= 0.2.2), so it mounts/unmounts with the
    # plugin and needs no static dsh-mcp-client row here. The server points at
    # this plugin's local authenticated proxy, which injects a fresh
    # Authorization: Bearer from the OAuth token store on every request.
    - id: notion-workspace-features
      name: 'dsh-notion-plugin'
      config:
        # OAuth uses dynamic client registration (RFC 7591); no static client
        # credentials are configured. Redirect URI must match the loopback
        # callback the plugin listens on.
        redirectUri: http://localhost:53682/callback
